[pytest]
# Discover tests across the monorepo; skip build/vendor dirs.
testpaths =
    tests
    infra/tests
    agents/hello_agent/tests
    app/api/tests
    app/orchestrator/tests
    app/tools/weather/tests
    app/tools/image/tests
    app/ingestion/tests
    app/tools/media/tests
    app/supervisor/tests
norecursedirs = cdk.out node_modules .venv .git dist .angular
addopts = -q
