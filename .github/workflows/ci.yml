name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  id-token: write   # OIDC federation to AWS (no static keys)
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can diff the pushed commit range
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q || echo "no tests yet"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      agents: ${{ steps.filter.outputs.agents }}
      app: ${{ steps.filter.outputs.app }}
      prompts: ${{ steps.filter.outputs.prompts }}
      guardrails: ${{ steps.filter.outputs.guardrails }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            agents:
              - 'agents/**'
            app:
              - 'app/**'
            prompts:
              - 'prompts/**'
            guardrails:
              - 'guardrails/**'
            frontend:
              - 'frontend/**'
  deploy-dev:
    needs: [quality, changes]
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.agents == 'true' ||
       needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.prompts == 'true' ||
       needs.changes.outputs.guardrails == 'true' ||
       needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CDK + deps
        run: npm install -g aws-cdk && pip install -r infra/requirements.txt
      # Deploy the app stacks. Order matters on a cold environment: foundation (the DynamoDB
      # table) must exist before client-api, which resolves it by stable name; prompts and
      # guardrails must exist before the agent runtime, which resolves them by name at cold
      # start; frontend must exist (bucket created) before the sync step below. CDK no-ops any
      # stack whose template is unchanged, so listing all six is safe regardless of which
      # folder triggered the run.
      - name: Deploy dev (app stacks)
        run: >-
          cd infra && cdk deploy
          tendril-dev-foundation
          tendril-dev-client-api
          tendril-dev-prompts
          tendril-dev-guardrails
          tendril-dev-agentcore
          tendril-dev-frontend
          --context env_name=dev --require-approval never
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci && npx ng build
        working-directory: frontend
      - name: Sync frontend to S3
        if: needs.changes.outputs.frontend == 'true'
        run: aws s3 sync frontend/dist/tendril-web/browser/ s3://tendril-dev-web --delete
# prod deploys are gated separately (tag/manual approval) - added in a later story.
