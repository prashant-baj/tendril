# Pre-commit hooks for Tendril — ruff (system, matches ruff.toml + CI) + gitleaks (secret
# scan, matches .gitleaks.toml + CI) + basic hygiene. Install with `.\tasks.ps1 hooks`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        # tsconfig*.json and .vscode/*.json are JSONC (Angular CLI generates them with
        # `//` comments) — valid TS/VS Code config, invalid strict JSON. Excluded rather
        # than stripped of comments, which is the standard convention for these files.
        exclude: '(^|/)tsconfig[^/]*\.json$|(^|/)\.vscode/.*\.json$'
      - id: check-added-large-files
        # Lockfiles are expected to be large and must be committed in full for
        # reproducible installs — don't block them; still guards against accidental
        # large binaries everywhere else.
        exclude: '(^|/)(package|npm)-.*lock\.json$|(^|/)poetry\.lock$'
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
