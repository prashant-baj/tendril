<div class="entry">
  <div class="rail">
    <span class="node" [class.orchestrator]="entry.isOrchestrator">
      <td-icon [name]="entry.icon" size="15px" />
    </span>
    <span class="line" [class.hidden]="last"></span>
  </div>
  <div class="body">
    <div class="head">
      <span class="agent">{{ entry.agent }}</span>
      <span class="duration">{{ entry.ms }}</span>
    </div>
    <div class="says">{{ entry.says }}</div>
  </div>
</div>
