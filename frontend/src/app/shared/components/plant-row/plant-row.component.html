<button type="button" class="row" (click)="activate.emit()">
  <span class="thumb">
    <td-icon [name]="plant.icon" size="24px" />
  </span>
  <span class="body">
    <span class="name">{{ plant.name }}</span>
    <span class="meta">{{ plant.meta }}</span>
  </span>
  <td-chip [tone]="healthTone" shape="pill" [icon]="healthIcon" [iconFilled]="true">{{ healthLabel }}</td-chip>
</button>
