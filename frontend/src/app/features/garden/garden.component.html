@if (garden(); as g) {
  <div class="screen">
    <section
      class="card intro"
      [class.has-photo]="g.photoUrl"
      [style.background-image]="
        g.photoUrl
          ? 'linear-gradient(180deg, rgba(20, 30, 20, 0.15), rgba(15, 25, 15, 0.75)), url(' +
            g.photoUrl +
            ')'
          : null
      "
    >
      <h2>{{ g.name }}</h2>
      @if (g.vision) {
        <p>&ldquo;{{ g.vision }}&rdquo;</p>
      }
      <div class="facts">
        @for (fact of gardenFacts(); track fact.label) {
          <span class="fact">
            <td-icon [name]="fact.icon" size="15px" />{{ fact.label }}
          </span>
        }
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>{{ plants().length }} plants</h2>
        <button type="button" class="link" (click)="openAddPlant()">Add plant</button>
      </div>
      <div class="card list">
        @for (plant of plants(); track plant.plantId) {
          <td-plant-row
            [plant]="plant"
            (activate)="openCapture()"
            (delete)="deletePlant(plant.plantId)"
          />
        }
      </div>
    </section>
  </div>
}
