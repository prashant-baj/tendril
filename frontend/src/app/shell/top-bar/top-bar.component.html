<header class="top-bar" [class.wide]="layout.isWide()">
  <div class="left">
    @if (!layout.isWide()) {
      <span class="logo">
        <td-icon name="eco" [filled]="true" size="18px" />
      </span>
    }
    <div class="title-block">
      <div class="title">{{ title() }}</div>
      <button
        type="button"
        class="garden-switch"
        (click)="toggleGardenDropdown()"
        [attr.aria-expanded]="dropdownOpen()"
      >
        {{ garden()?.name ?? 'My Garden' }}
        <td-icon name="expand_more" size="16px" class="chevron" [class.open]="dropdownOpen()" />
      </button>
      @if (dropdownOpen()) {
        <div class="garden-dropdown">
          @for (g of gardens(); track g.gardenId) {
            <button
              type="button"
              class="garden-option"
              [class.active]="g.gardenId === garden()?.gardenId"
              (click)="selectGarden(g.gardenId)"
            >
              {{ g.name }}
            </button>
          } @empty {
            <div class="garden-option empty">No other gardens yet.</div>
          }
        </div>
      }
    </div>
  </div>
  <div class="right">
    @if (weather(); as w) {
      <span class="weather">
        <td-icon [name]="weatherPresentation()?.icon ?? 'sunny'" size="16px" />
        <span>{{ w.temperatureC | number: '1.0-0' }}°C · {{ weatherPresentation()?.label }}</span>
      </span>
    }
    <a class="bell" routerLink="/activity" aria-label="Activity and notifications">
      <td-icon name="notifications" size="22px" />
      <span class="dot" aria-hidden="true"></span>
    </a>
  </div>
</header>
