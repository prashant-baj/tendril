openapi: 3.0.1
info:
  title: Tendril Client API
  version: "0.1.0"
  description: >
    Tendril's user-facing Client API. Contract-first per ADR-0011: this file is the actual
    deploy artifact — infra/stacks/client_api_stack.py imports it directly via
    apigateway.SpecRestApi, patching each operation's x-amazon-apigateway-integration.uri
    with the real Lambda ARN at synth time. Covers OB-01 (Setup My Garden), OB-02 (Add a Plant,
    with a photo), and WS-01's goal-intake operation (the media op WS-01 originally scoped is
    already covered by OB-02, per docs/roadmap.md's resequencing note); the rest of ADR-0004's
    endpoint table is added incrementally as later stories land.
    API keys (ADR-0021): every operation except the CORS OPTIONS preflight declares the
    `api_key` security scheme (an `x-api-key` header). ClientApiStack strips these requirements
    from the deployed copy while `require_api_key` is false in dev (staged rollout); prod always
    enforces.

paths:
  /gardens:
    post:
      operationId: createGarden
      security:
        - api_key: []
      summary: Create a named garden
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GardenCreateRequest"
      responses:
        "201":
          description: Garden created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    get:
      operationId: listGardens
      security:
        - api_key: []
      summary: List every garden the caller owns (multi-garden switcher)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The caller's gardens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GardenSummary"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: &cors-preflight
      summary: CORS preflight
      # The browser preflight never carries the key, so OPTIONS stays open (ADR-0021 decision 7).
      security: []
      responses:
        "200":
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string}
            Access-Control-Allow-Methods:
              schema: {type: string}
            Access-Control-Allow-Headers:
              schema: {type: string}
          content: {}
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PATCH,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-User-Id,x-api-key'"

  /gardens/{gardenId}:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: getGarden
      security:
        - api_key: []
      summary: Read a garden by id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garden"
        "404":
          description: No such garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    patch:
      operationId: updateGarden
      security:
        - api_key: []
      summary: Update a garden's context block, climate zone, and/or vision (ADR-0032)
      description: >
        `context` is replaced as a whole block (no field-level merge). Returns the updated garden.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GardenUpdateRequest"
      responses:
        "200":
          description: The updated garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garden"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/weather:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: getGardenWeather
      security:
        - api_key: []
      summary: Real current weather for this garden's own location
      responses:
        "200":
          description: Current weather
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenWeather"
        "404":
          description: No such garden, or its location couldn't be resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The upstream geocoding/weather service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/media:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createMediaUpload
      security:
        - api_key: []
      summary: Get a presigned URL to upload a photo directly to S3
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "201":
          description: Presigned upload URL issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plants:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createPlant
      security:
        - api_key: []
      summary: Add a plant to a garden
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantCreateRequest"
      responses:
        "201":
          description: Plant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The stake number is already used by another plant in this garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    get:
      operationId: listPlants
      security:
        - api_key: []
      summary: List every plant in a garden
      responses:
        "200":
          description: The garden's plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plant"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plants/bulk:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: bulkCreatePlants
      security:
        - api_key: []
      summary: Create one plant per stake number in a range (CP-02, ADR-0032)
      description: >
        Idempotent. A stake number already used in this garden is reported under `skipped` and
        never duplicated or overwritten, so a partial run can be retried.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantBulkCreateRequest"
      responses:
        "201":
          description: Plants created (and/or skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantBulkCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plants/{plantId}:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/PlantId"
    get:
      operationId: getPlant
      security:
        - api_key: []
      summary: A plant and one page of its dated history (CP-05, ADR-0035)
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from the previous page.
          schema: {type: string}
        - name: order
          in: query
          required: false
          schema: {type: string, enum: [newest, oldest], default: newest}
        - name: includeRetracted
          in: query
          required: false
          description: Also return moved-away photos and the retraction entries (audit trail).
          schema: {type: string, enum: ["true", "false"], default: "false"}
      responses:
        "200":
          description: The plant and a page of its history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such plant in this garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    patch:
      operationId: updatePlant
      security:
        - api_key: []
      summary: Change a plant's stage (e.g. `removed` for a palm that died — keeps its history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantUpdateRequest"
      responses:
        "200":
          description: The updated plant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such plant in this garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    delete:
      operationId: deletePlant
      security:
        - api_key: []
      summary: Remove a plant from a garden
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Plant deleted (idempotent — also returned if it didn't exist)
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plants/{plantId}/history:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/PlantId"
    post:
      operationId: addPlantLog
      security:
        - api_key: []
      summary: Log a note and/or status (optionally with photos) in a plant's history (CP-03, ADR-0035)
      description: >
        Append-only. Dated `observedOn` when given, else by the first photo's own capture date,
        else today. Photos must belong to this garden and not be filed under another plant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantLogCreateRequest"
      responses:
        "201":
          description: The new history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantLogEntry"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such plant in this garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A photo is filed under another plant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createGoal
      security:
        - api_key: []
      summary: Submit an issue/goal for a garden — triggers the orchestrator asynchronously
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "202":
          description: >
            Goal accepted — persisted and handed off for async orchestration (ADR-0004/
            ADR-0012). Not a synchronous result; nothing about the goal's eventual plan is
            known yet at this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    get:
      operationId: listGoals
      security:
        - api_key: []
      summary: List every goal submitted for a garden
      responses:
        "200":
          description: The garden's goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals/{goalId}:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/GoalId"
    get:
      operationId: getGoalDetail
      security:
        - api_key: []
      summary: >
        Read a goal's full detail — its proposed/approved Plan and Tasks (if any), its attached
        media (with freshly-generated presigned download URLs), and its chat message thread
        (PA-01/PA-02/PA-03)
      responses:
        "200":
          description: The goal's full detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalDetail"
        "404":
          description: No such goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals/{goalId}/messages:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/GoalId"
    post:
      operationId: postGoalMessage
      security:
        - api_key: []
      summary: >
        Send a chat message about a goal — text and/or up to 4 photos, optionally about one task
        (a check-in, ADR-0034); triggers the orchestrator asynchronously (PA-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalMessageCreateRequest"
      responses:
        "202":
          description: >
            Message accepted — persisted and handed off for async orchestration, same posture
            as createGoal. Not a synchronous result; any proposed action arrives with the reply.
          content:
            application/json:
              schema:
                type: object
                required: [messageId]
                properties:
                  messageId: {type: string}
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: A photo or the task isn't in this garden/goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The task is already done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals/{goalId}/tasks/{taskId}/checkins:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/GoalId"
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: postTaskCheckin
      security:
        - api_key: []
      summary: >
        Check in on a task with a photo (ADR-0034). Posts a check-in chat message; the
        orchestrator checks which plant the photo shows and proposes completing the task. The
        task is only marked done when the gardener confirms (confirmAction).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCheckinRequest"
      responses:
        "202":
          description: Check-in posted; completion awaits confirmation
          content:
            application/json:
              schema:
                type: object
                required: [taskId, status, messageId]
                properties:
                  taskId: {type: string}
                  status: {type: string, enum: [pending_confirmation]}
                  messageId: {type: string}
        "409":
          description: The task is already done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such task or media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals/{goalId}/actions/{actionId}/confirm:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/GoalId"
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: confirmAction
      security:
        - api_key: []
      summary: >
        Confirm a proposed action (ADR-0034) — the only way a proposed task completion or
        plant-identity change is applied. Synchronous, no model call, idempotent.
      responses:
        "200":
          description: Applied (or already confirmed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: No such action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already rejected/superseded, or no longer applicable (e.g. task done)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals/{goalId}/actions/{actionId}/reject:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/GoalId"
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: rejectAction
      security:
        - api_key: []
      summary: Dismiss a proposed action (ADR-0034); changes nothing else. Idempotent.
      responses:
        "200":
          description: Dismissed (or already dismissed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: No such action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already confirmed or superseded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plans/{planId}/approve:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: approvePlan
      security:
        - api_key: []
      summary: >
        Approve a proposed plan (PA-02). A pure, deterministic status flip — never depends on
        model behavior, so this is handled synchronously, not routed through the orchestrator.
      responses:
        "200":
          description: Plan approved
        "404":
          description: No such plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/activities:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createActivity
      security:
        - api_key: []
      summary: Plan farm work, one-off or recurring (ADR-0038)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreateRequest"
      responses:
        "201":
          description: The planned activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    get:
      operationId: listActivities
      security:
        - api_key: []
      summary: Farm work, overdue first, then due, upcoming, unscheduled, paused, done (ADR-0038)
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: {type: string, enum: ["true", "false"], default: "false"}
      responses:
        "200":
          description: The garden's activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/activities/{activityId}:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/ActivityId"
    patch:
      operationId: updateActivity
      security:
        - api_key: []
      summary: Edit, pause, resume or archive an activity; edits are reassessed by the Supervisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdateRequest"
      responses:
        "200":
          description: The updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/activity-logs:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: logActivity
      security:
        - api_key: []
      summary: "Record farm work done: ad-hoc, or a log of a planned activity (ADR-0038)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityLogCreateRequest"
      responses:
        "201":
          description: The new log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLog"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    get:
      operationId: listActivityLogs
      security:
        - api_key: []
      summary: Farm work done, newest first, paged
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
      responses:
        "200":
          description: A page of activity logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogPage"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/actions:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: listGardenActions
      security:
        - api_key: []
      summary: The Supervisor's open suggestions for this garden (ADR-0039)
      responses:
        "200":
          description: Open suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GardenAction"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/actions/{actionId}/confirm:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: confirmGardenAction
      security:
        - api_key: []
      summary: "Apply a Supervisor suggestion: sync, no model call (ADR-0039)"
      responses:
        "200":
          description: Done (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: No such suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The suggestion is no longer open or no longer applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/actions/{actionId}/reject:
    parameters:
      - $ref: "#/components/parameters/GardenId"
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: rejectGardenAction
      security:
        - api_key: []
      summary: Dismiss a Supervisor suggestion
      responses:
        "200":
          description: Done (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "404":
          description: No such suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The suggestion is no longer open or no longer applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/tasks:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: listTasks
      security:
        - api_key: []
      summary: List every task across every goal in a garden (Phase 6)
      responses:
        "200":
          description: The garden's tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/activity:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: listActivity
      security:
        - api_key: []
      summary: The garden's event timeline, newest first (Phase 6)
      responses:
        "200":
          description: The garden's activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: x-api-key

  parameters:
    GardenId:
      name: gardenId
      in: path
      required: true
      schema:
        type: string

    PlantId:
      name: plantId
      in: path
      required: true
      schema:
        type: string

    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string

    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string

    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string

    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string

    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string

    UserId:
      name: X-User-Id
      in: header
      required: true
      description: >
        Per-browser anonymous identifier (crypto.randomUUID(), persisted client-side) until
        Cognito auth lands (ADR-0004's auth seam). Not validated as an identity here — only
        required to be present, so every Garden record has a stable owner key.
      schema:
        type: string

  schemas:
    GardenCreateRequest:
      type: object
      required: [name, geolocation]
      properties:
        name:
          type: string
          minLength: 1
        geolocation:
          type: string
          minLength: 1
          description: Free-text location (e.g. "Pune, India") — getGardenWeather geocodes this
            on demand; no separate lat/lon is stored.
        vision:
          type: string
          description: Optional short description of what this garden is for.
        gardenId:
          type: string
          description: Client-supplied id, used only when a garden photo was uploaded first (that
            upload needs an existing gardenId, so the frontend generates one up front for this
            case). Omit to let the server generate one, as for every garden without a photo.
        mediaId:
          type: string
          description: Id from a prior createMediaUpload call (uploaded under the same gardenId
            given above) — becomes this garden's banner photo.
        climateZone:
          type: string
          maxLength: 100
        context:
          $ref: "#/components/schemas/GardenContext"

    GardenUpdateRequest:
      type: object
      minProperties: 1
      properties:
        context:
          $ref: "#/components/schemas/GardenContext"
        climateZone:
          type: string
          maxLength: 100
        vision:
          type: string

    GardenContext:
      type: object
      additionalProperties: false
      description: >
        Whole-farm facts every agent reasons with (ADR-0032). All fields optional. Injected into
        the orchestrator and specialist prompts on every turn, except notificationRecipients,
        which are personal data and never sent to a model.
      properties:
        soil:
          type: string
          maxLength: 1000
        irrigation:
          type: string
          maxLength: 1000
        intercrop:
          type: string
          maxLength: 1000
        layout:
          type: string
          maxLength: 1000
        notes:
          type: string
          maxLength: 1000
        stakeRange:
          type: object
          required: [min, max]
          additionalProperties: false
          description: Valid stake-number range for the main block. A plant outside it is
            accepted but flagged outOfRange.
          properties:
            min:
              type: integer
              minimum: 1
            max:
              type: integer
              minimum: 1
              maximum: 99999
        notificationRecipients:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/NotificationRecipient"

    NotificationRecipient:
      type: object
      required: [name, e164]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        e164:
          type: string
          pattern: "^\\+[1-9]\\d{6,14}$"
          description: Mobile number in E.164 format, e.g. +919800000000.

    GardenCreateResponse:
      type: object
      required: [gardenId]
      properties:
        gardenId:
          type: string

    Garden:
      type: object
      required: [gardenId, name, geolocation, ownerUserId, createdAt]
      properties:
        gardenId:
          type: string
        name:
          type: string
        geolocation:
          type: string
        vision:
          type: string
        ownerUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        photoUrl:
          type: string
          description: Freshly-generated presigned GET url (per read, never stored/reused) for
            this garden's banner photo, present only if one was set at creation.
        climateZone:
          type: string
        context:
          $ref: "#/components/schemas/GardenContext"

    GardenWeather:
      type: object
      required: [temperatureC, weatherCode]
      properties:
        temperatureC:
          type: number
        weatherCode:
          type: integer
          description: Raw Open-Meteo WMO weather code — deliberately not resolved to an
            icon/label server-side; the frontend maps it to presentation.

    GardenSummary:
      type: object
      required: [gardenId, name]
      properties:
        gardenId:
          type: string
        name:
          type: string
          description: Denormalized onto the USER#{id}/GARDEN#{id} ownership index at creation
            time (data-architecture.md §2) — lets listGardens be one cheap Query, no GSI/scan.

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MediaUploadRequest:
      type: object
      required: [contentType, fileName, sizeBytes]
      properties:
        contentType:
          type: string
          description: >
            MIME type of the file being uploaded (e.g. "image/jpeg"). The presigned PUT is signed
            with it, but it is never trusted for analysis: the Ingestion Lambda records the real
            format from the file's bytes (ADR-0033).
        fileName:
          type: string
          minLength: 1
          description: Only the base name is used in the storage key.
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: File size in bytes. Photos are limited to 10 MB (ADR-0033); larger is a 400.

    MediaUploadResponse:
      type: object
      required: [uploadUrl, mediaId]
      properties:
        uploadUrl:
          type: string
          description: Presigned S3 PUT URL — the frontend uploads directly to it, never via
            the Lambda.
        mediaId:
          type: string

    PlantCreateRequest:
      type: object
      required: [species]
      properties:
        species:
          type: string
          minLength: 1
        variety:
          type: string
        mediaId:
          type: string
          description: Id returned by a prior createMediaUpload call, once the upload itself
            has completed.
        stage:
          type: string
          minLength: 1
          maxLength: 50
          description: Growth stage. Defaults to "new".
        stakeNo:
          type: integer
          minimum: 1
          maximum: 99999
          description: Optional number on the plant's physical stake (ADR-0032). Unique within
            the garden; never generated by Tendril.

    PlantCreateResponse:
      type: object
      required: [plantId]
      properties:
        plantId:
          type: string
        stakeNo:
          type: integer
        outOfRange:
          type: boolean
          description: True when stakeNo falls outside the garden's context.stakeRange. The
            plant is still created.
        photoUrl:
          type: string
          description: Freshly-generated presigned GET url for the plant's linked photo (OB-03),
            present only if a mediaId was given at creation.

    PlantBulkCreateRequest:
      type: object
      required: [species, stakeFrom, stakeTo]
      properties:
        species:
          type: string
          minLength: 1
        variety:
          type: string
        stage:
          type: string
          minLength: 1
          maxLength: 50
        stakeFrom:
          type: integer
          minimum: 1
        stakeTo:
          type: integer
          minimum: 1
          maximum: 99999
          description: Inclusive. At most 200 plants per call.

    PlantBulkCreateResponse:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: array
          items:
            type: object
            required: [plantId, stakeNo]
            properties:
              plantId:
                type: string
              stakeNo:
                type: integer
              outOfRange:
                type: boolean
        skipped:
          type: array
          description: Stake numbers already used in this garden (left untouched).
          items:
            type: integer

    Plant:
      type: object
      required: [plantId, species, stage]
      properties:
        plantId:
          type: string
        species:
          type: string
        variety:
          type: string
        stage:
          type: string
        stakeNo:
          type: integer
          description: Number on the plant's physical stake, when it has one (ADR-0032).
            listPlants orders by it, unnumbered plants last.
        photoUrl:
          type: string
          description: Freshly-generated presigned GET url per read (OB-03) — never stored, same
            posture as GoalMedia's downloadUrl. Absent if the plant has no linked photo.
        latestStatus:
          type: string
          enum: [healthy, ok, watch]
          description: Status of the newest history entry that set one (ADR-0035 §4).
        latestObservedOn:
          type: string
          format: date
          description: Date of the newest history entry.
        historyCount:
          type: integer
          minimum: 0
          description: Number of visible history entries.

    PlantUpdateRequest:
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          minLength: 1
          description: e.g. "young", "bearing", or "removed" for a plant that died.

    Schedule:
      type: object
      description: >
        Counted from the last time the work was done (ADR-0038 §2). `everyDays`, or a window
        `minDays`..`maxDays` ("every 3-4 weeks" = 21..28). Absent or null = one-off.
      properties:
        everyDays: {type: integer, minimum: 1, maximum: 365}
        minDays: {type: integer, minimum: 1, maximum: 365}
        maxDays: {type: integer, minimum: 1, maximum: 365}

    Targets:
      description: '"all" (garden-wide) or the plant ids the work is for.'
      oneOf:
        - type: string
          enum: [all]
        - type: array
          minItems: 1
          items: {type: string}

    Assessment:
      type: object
      description: >
        The Supervisor's view of an activity (ADR-0038 §4, ADR-0039): advisory only, never blocks.
        `stale` when the activity changed after it was assessed.
      required: [verdict, summary, benefits, risks, conflicts]
      properties:
        verdict: {type: string, enum: [beneficial, caution, harmful, unknown]}
        summary: {type: string}
        benefits: {type: array, items: {type: string}}
        risks: {type: array, items: {type: string}}
        conflicts:
          type: array
          items:
            type: object
            required: [with, reason]
            properties:
              with: {type: string}
              reason: {type: string}
        suggestion: {type: string}
        assessedAt: {type: string}
        stale: {type: boolean}

    Activity:
      type: object
      required: [activityId, title, kind, targets, status, dueState, source]
      properties:
        activityId: {type: string}
        title: {type: string}
        kind: {type: string, enum: [input, operation]}
        details: {type: string}
        product: {type: string}
        dose: {type: string}
        targets:
          $ref: "#/components/schemas/Targets"
        schedule:
          $ref: "#/components/schemas/Schedule"
        status: {type: string, enum: [active, paused, done, archived]}
        dueState: {type: string, enum: [overdue, due, upcoming, none, paused, done]}
        startOn: {type: string, format: date}
        nextDueOn: {type: string, format: date}
        overdueOn: {type: string, format: date}
        lastDoneOn: {type: string, format: date}
        source: {type: string, enum: [user, confirmed]}
        assessment:
          $ref: "#/components/schemas/Assessment"

    ActivityCreateRequest:
      type: object
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [input, operation], default: operation}
        details: {type: string, maxLength: 1000}
        product: {type: string, maxLength: 200}
        dose: {type: string, maxLength: 200}
        targets:
          $ref: "#/components/schemas/Targets"
        schedule:
          $ref: "#/components/schemas/Schedule"
        startOn:
          type: string
          format: date
          description: When it's first due (default today).

    ActivityUpdateRequest:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [input, operation]}
        details: {type: string, maxLength: 1000}
        product: {type: string, maxLength: 200}
        dose: {type: string, maxLength: 200}
        targets:
          $ref: "#/components/schemas/Targets"
        schedule:
          $ref: "#/components/schemas/Schedule"
        startOn: {type: string, format: date}
        status: {type: string, enum: [active, paused, archived]}

    ActivityLogCreateRequest:
      type: object
      description: >
        With `activityId`, the log starts from that activity's title/kind/details/targets (any can
        be overridden) and moves its next due date. Without it, an ad-hoc log; `title` is required.
      properties:
        activityId: {type: string}
        title: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [input, operation]}
        details: {type: string, maxLength: 1000}
        product: {type: string, maxLength: 200}
        dose: {type: string, maxLength: 200}
        targets:
          $ref: "#/components/schemas/Targets"
        doneOn:
          type: string
          format: date
          description: When it was done (not in the future; default today).
        note: {type: string, maxLength: 1000}
        mediaIds:
          type: array
          maxItems: 6
          items: {type: string}

    ActivityLog:
      type: object
      required: [logId, title, kind, targets, doneOn, media]
      properties:
        logId: {type: string}
        activityId: {type: string}
        title: {type: string}
        kind: {type: string, enum: [input, operation]}
        details: {type: string}
        product: {type: string}
        dose: {type: string}
        targets:
          $ref: "#/components/schemas/Targets"
        doneOn: {type: string, format: date}
        note: {type: string}
        media:
          type: array
          items:
            $ref: "#/components/schemas/PlantPhoto"
        assessment:
          $ref: "#/components/schemas/Assessment"

    ActivityLogPage:
      type: object
      required: [logs]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
        nextCursor: {type: string}

    GardenAction:
      type: object
      description: A Supervisor suggestion; only the confirm endpoint applies it (ADR-0039 §5).
      required: [actionId, type, summary, status, createdAt]
      properties:
        actionId: {type: string}
        type:
          type: string
          enum: [create_activity, set_schedule, move_due, pause_activity, resume_activity]
        summary: {type: string}
        reason: {type: string}
        status: {type: string, enum: [proposed, confirmed, rejected, superseded]}
        activityId: {type: string}
        createdAt: {type: string}

    PlantPhoto:
      type: object
      required: [mediaId, thumbUrl, url]
      properties:
        mediaId: {type: string}
        kind:
          type: string
          enum: [photo, video]
          description: >
            A video's `thumbUrl` is its poster frame once processed, and `url` is the playable
            original (ADR-0038 §7).
        thumbUrl:
          type: string
          description: Presigned GET url of the 512 px thumbnail (or the original if unprocessed).
        url:
          type: string
          description: Presigned GET url of the analysis copy (or the original if unprocessed).

    PlantLogEntry:
      type: object
      required: [entryId, observedOn, kind, source, photos]
      properties:
        entryId: {type: string}
        observedOn: {type: string, format: date}
        observedAt:
          type: string
          description: Capture time from the photo, when known (local camera time, no zone).
        kind:
          type: string
          enum: [photo, checkin, log, retraction]
        source:
          type: string
          enum: [user, confirmed, auto, migration, tendril]
          description: >
            How the entry got there. `tendril`: a note in Tendril's own words for a saved goal
            (ADR-0037); it never sets a status.
        status:
          type: string
          enum: [healthy, ok, watch]
        note: {type: string}
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PlantPhoto"
        goalId: {type: string}
        taskId: {type: string}
        retracts:
          type: string
          description: For a retraction, the entry whose photo was moved away.

    PlantDetail:
      type: object
      required: [plant, history]
      properties:
        plant:
          $ref: "#/components/schemas/Plant"
        history:
          type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: "#/components/schemas/PlantLogEntry"
            nextCursor:
              type: string
              description: Pass as `cursor` to get the next page; absent on the last page.

    PlantLogCreateRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
        status:
          type: string
          enum: [healthy, ok, watch]
        mediaIds:
          type: array
          maxItems: 4
          items: {type: string}
        observedOn:
          type: string
          format: date
          description: When this was observed (not in the future). Default — see the operation.

    GoalCreateRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          description: The issue/prompt text in plain language (e.g. "leaves turning yellow").
        mediaIds:
          type: array
          items:
            type: string
          description: Ids from prior createMediaUpload calls, referencing attached photos.
        plantId:
          type: string
          description: >
            Optional — which plant this goal is about, if any (not every issue is plant-specific).
            When set, propagates onto every attached Media record and every Task the orchestrator
            later proposes for this goal.

    GoalCreateResponse:
      type: object
      required: [goalId, status]
      properties:
        goalId:
          type: string
        status:
          type: string
          description: Always "Intake" at creation — architecture.md §7.3's Goal lifecycle.

    Goal:
      type: object
      required: [goalId, description, type, status]
      properties:
        goalId:
          type: string
        description:
          type: string
        type:
          type: string
          description: >
            Goal classification (e.g. "diagnosis", "planning") — reserved for the orchestrator
            to set once it understands the goal; always a generic default at Intake time.
        status:
          type: string
          description: >
            Goal lifecycle (architecture.md §7.3): Intake, Decomposing, PlanProposed, Approved, or
            InformationSaved — a turn ended without a plan on a goal that has none (a check-in or
            a question); a later plan moves it to PlanProposed (ADR-0036). Not a closed enum:
            clients should show unknown values as-is.
        mediaIds:
          type: array
          items:
            type: string
        plantId:
          type: string
        plantStakeNo:
          type: integer
          description: >
            Stake number of the goal's plant, when it has one. Set only by getGoalDetail, for
            the goal header (ADR-0034 follow-up).

    Plan:
      type: object
      required: [planId, goalId, successCriteria, status]
      properties:
        planId:
          type: string
        goalId:
          type: string
        successCriteria:
          type: string
        status:
          type: string
          description: "\"PlanProposed\" or \"Approved\" (architecture.md §7.3)."
        trace:
          type: array
          items:
            $ref: "#/components/schemas/TraceEntry"
          description: The specialist-consultation record behind this plan's current version
            (PA-05) — "How this was decided". Absent for an older goal, or a plan that was
            synthesized from a fallback (no specialist actually consulted).

    TraceEntry:
      type: object
      required: [agent, says, ms]
      properties:
        agent:
          type: string
          description: Specialist name (registry `name`, e.g. "agronomy"), or "orchestrator" for
            the final synthesis step.
        says:
          type: string
          description: The full text of what this specialist (or the orchestrator's own
            synthesis) concluded — not display-truncated server-side; the frontend collapses
            long entries with a "Show more" toggle.
        ms:
          type: integer
          description: How long this step took, in milliseconds.
        isOrchestrator:
          type: boolean
          description: True only for the final synthesis entry, not a specialist call.

    Task:
      type: object
      required: [taskId, title, detail, scope, status]
      properties:
        taskId:
          type: string
        goalId:
          type: string
          description: The goal this task belongs to — always set (Phase 6), load-bearing for
            listTasks' cross-goal list to link a task back to its goal.
        title:
          type: string
        detail:
          type: string
        scope:
          type: string
          description: "\"plant\" or \"garden\"."
        status:
          type: string
          description: "\"pending\" or \"done\" — flips to \"done\" the moment a check-in photo is attached."
        plantId:
          type: string
          description: Inherited from the goal's plantId, if any, when this task was proposed.
        media:
          $ref: "#/components/schemas/GoalMedia"
          description: Present once a check-in photo has been attached (postTaskCheckin).
        feedback:
          type: string
          description: The orchestrator's assessment of this task's check-in photo against the
            plan (PA-05) — written asynchronously after postTaskCheckin, may take a few seconds
            to appear.

    TaskCheckinRequest:
      type: object
      required: [mediaId]
      properties:
        mediaId:
          type: string
          description: Id from a prior createMediaUpload call, once the upload itself has completed.
        note:
          type: string
          description: Optional words to go with the check-in; becomes the chat message text.

    Message:
      type: object
      required: [role, content, createdAt]
      properties:
        messageId:
          type: string
        role:
          type: string
          description: "\"user\" or \"assistant\"."
        content:
          type: string
          description: May be empty for a user message that only carries photos or a task.
        createdAt:
          type: string
          format: date-time
        media:
          type: array
          description: Photos attached to a user message (thumbnail URLs, ADR-0033/0034).
          items:
            $ref: "#/components/schemas/GoalMedia"
        taskId:
          type: string
          description: Present when the message is a check-in on this task (ADR-0034).
        actionId:
          type: string
          description: On an assistant reply, the proposed action it asks the gardener to confirm.

    Action:
      type: object
      description: >
        A change the orchestrator proposed (ADR-0034). Only confirmAction applies it; the
        frontend shows Confirm/Change on `proposed` ones.
      required: [actionId, type, summary, status, createdAt]
      properties:
        actionId:
          type: string
        type:
          type: string
          enum: [complete_task, set_plant, set_goal_plant, create_plant]
        summary:
          type: string
          description: >
            The sentence shown to the gardener, e.g. "This photo shows #10, but the task is
            for #1. Is it #10's photo?"
        status:
          type: string
          enum: [proposed, confirmed, rejected, superseded]
        createdAt:
          type: string
        taskId:
          type: string
        candidates:
          type: array
          description: Stake numbers to choose from when the read was unsure.
          items:
            type: integer

    ActionResult:
      type: object
      required: [actionId, status]
      properties:
        actionId:
          type: string
        status:
          type: string
          enum: [confirmed, rejected]
        type:
          type: string

    GoalMedia:
      type: object
      required: [mediaId, downloadUrl]
      properties:
        mediaId:
          type: string
        downloadUrl:
          type: string
          description: Freshly-generated, short-lived presigned S3 GET URL — never stored/reused.

    ActivityEvent:
      type: object
      required: [type, payload, createdAt]
      properties:
        type:
          type: string
          description: "One of \"goal.submitted\", \"plan.updated\", \"plan.approved\",
            \"task.checkin\" (Phase 6). Deliberately UI-agnostic — no icon/tone/title baked in
            server-side; the frontend maps type -> presentation."
        payload:
          type: object
          description: Event-specific context, e.g. {goalId, description} for goal.submitted.
        createdAt:
          type: string
          format: date-time
        goalId:
          type: string
          description: Present whenever the event's payload carries one — lets the frontend link
            an activity entry back to its goal.

    GoalDetail:
      type: object
      required: [goal, tasks, media, messages]
      properties:
        goal:
          $ref: "#/components/schemas/Goal"
        plan:
          $ref: "#/components/schemas/Plan"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        media:
          type: array
          items:
            $ref: "#/components/schemas/GoalMedia"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        actions:
          type: array
          description: Every proposal on this goal, oldest first (ADR-0034).
          items:
            $ref: "#/components/schemas/Action"

    GoalMessageCreateRequest:
      type: object
      description: At least one of content (non-blank), mediaIds or taskId (ADR-0034).
      properties:
        content:
          type: string
        mediaIds:
          type: array
          maxItems: 4
          items:
            type: string
          description: Ids from prior createMediaUpload calls.
        taskId:
          type: string
          description: Makes the message a check-in on this pending task; text and photo optional.
