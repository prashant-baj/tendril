openapi: 3.0.1
info:
  title: Tendril Client API
  version: "0.1.0"
  description: >
    Tendril's user-facing Client API. Contract-first per ADR-0011: this file is the actual
    deploy artifact — infra/stacks/client_api_stack.py imports it directly via
    apigateway.SpecRestApi, patching each operation's x-amazon-apigateway-integration.uri
    with the real Lambda ARN at synth time. Covers OB-01 (Setup My Garden), OB-02 (Add a Plant,
    with a photo), and WS-01's goal-intake operation (the media op WS-01 originally scoped is
    already covered by OB-02, per docs/roadmap.md's resequencing note); the rest of ADR-0004's
    endpoint table is added incrementally as later stories land.

paths:
  /gardens:
    post:
      operationId: createGarden
      summary: Create a named garden
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GardenCreateRequest"
      responses:
        "201":
          description: Garden created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GardenCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: &cors-preflight
      summary: CORS preflight
      responses:
        "200":
          description: CORS preflight response
          headers:
            Access-Control-Allow-Origin:
              schema: {type: string}
            Access-Control-Allow-Methods:
              schema: {type: string}
            Access-Control-Allow-Headers:
              schema: {type: string}
          content: {}
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-User-Id'"

  /gardens/{gardenId}:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    get:
      operationId: getGarden
      summary: Read a garden by id
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garden"
        "404":
          description: No such garden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/media:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createMediaUpload
      summary: Get a presigned URL to upload a photo directly to S3
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadRequest"
      responses:
        "201":
          description: Presigned upload URL issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/plants:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createPlant
      summary: Add a plant to a garden
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantCreateRequest"
      responses:
        "201":
          description: Plant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

  /gardens/{gardenId}/goals:
    parameters:
      - $ref: "#/components/parameters/GardenId"
    post:
      operationId: createGoal
      summary: Submit an issue/goal for a garden — triggers the orchestrator asynchronously
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "202":
          description: >
            Goal accepted — persisted and handed off for async orchestration (ADR-0004/
            ADR-0012). Not a synchronous result; nothing about the goal's eventual plan is
            known yet at this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalCreateResponse"
        "400":
          description: Missing/invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: "__LAMBDA_INTEGRATION_URI__"
        passthroughBehavior: when_no_match
    options: *cors-preflight

components:
  parameters:
    GardenId:
      name: gardenId
      in: path
      required: true
      schema:
        type: string

    UserId:
      name: X-User-Id
      in: header
      required: true
      description: >
        Per-browser anonymous identifier (crypto.randomUUID(), persisted client-side) until
        Cognito auth lands (ADR-0004's auth seam). Not validated as an identity here — only
        required to be present, so every Garden record has a stable owner key.
      schema:
        type: string

  schemas:
    GardenCreateRequest:
      type: object
      required: [name, geolocation]
      properties:
        name:
          type: string
          minLength: 1
        geolocation:
          type: string
          minLength: 1
          description: Free-text location for now (e.g. "Pune"); structured lat/lon is future work.
        vision:
          type: string
          description: Optional short description of what this garden is for.

    GardenCreateResponse:
      type: object
      required: [gardenId]
      properties:
        gardenId:
          type: string

    Garden:
      type: object
      required: [gardenId, name, geolocation, ownerUserId, createdAt]
      properties:
        gardenId:
          type: string
        name:
          type: string
        geolocation:
          type: string
        vision:
          type: string
        ownerUserId:
          type: string
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MediaUploadRequest:
      type: object
      required: [contentType, fileName]
      properties:
        contentType:
          type: string
          description: MIME type of the file being uploaded (e.g. "image/jpeg").
        fileName:
          type: string
          minLength: 1

    MediaUploadResponse:
      type: object
      required: [uploadUrl, mediaId]
      properties:
        uploadUrl:
          type: string
          description: Presigned S3 PUT URL — the frontend uploads directly to it, never via
            the Lambda.
        mediaId:
          type: string

    PlantCreateRequest:
      type: object
      required: [species]
      properties:
        species:
          type: string
          minLength: 1
        variety:
          type: string
        mediaId:
          type: string
          description: Id returned by a prior createMediaUpload call, once the upload itself
            has completed.

    PlantCreateResponse:
      type: object
      required: [plantId]
      properties:
        plantId:
          type: string

    GoalCreateRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          description: The issue/prompt text in plain language (e.g. "leaves turning yellow").
        mediaIds:
          type: array
          items:
            type: string
          description: Ids from prior createMediaUpload calls, referencing attached photos.

    GoalCreateResponse:
      type: object
      required: [goalId, status]
      properties:
        goalId:
          type: string
        status:
          type: string
          description: Always "Intake" at creation — architecture.md §7.3's Goal lifecycle.

    Goal:
      type: object
      required: [goalId, description, type, status]
      properties:
        goalId:
          type: string
        description:
          type: string
        type:
          type: string
          description: >
            Goal classification (e.g. "diagnosis", "planning") — reserved for the orchestrator
            to set once it understands the goal; always a generic default at Intake time.
        status:
          type: string
        mediaIds:
          type: array
          items:
            type: string
